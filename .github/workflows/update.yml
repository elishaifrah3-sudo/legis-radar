name: עדכון מכ״ם חקיקה

on:
  schedule:
    - cron: "0 * * * *"   # כל שעה, בדיוק בשעה עגולה
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  update-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run collector
        run: python scripts/update_feed.py

      - name: Commit updated feed
        run: |
          git config user.name "legis-radar-bot"
          git config user.email "actions@github.com"
          git add docs/feed.json
          git diff --quiet --cached || git commit -m "עדכון אוטומטי: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Run health check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PAGES_URL: "https://elishaifrah3-sudo.github.io/legis-radar/"
        run: python scripts/health_check.py
