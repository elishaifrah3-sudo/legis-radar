name: עדכון מכ״ם חקיקה

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: legislation-feed
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Collect existing feed
        run: python scripts/update_feed.py

      - name: Snapshot OData parliamentary entities
        run: python scripts/collect_parliament.py

      - name: Commit collected feed and snapshot
        run: |
          git config user.name "legis-radar-bot"
          git config user.email "actions@github.com"
          git add docs/feed.json docs/odata_snapshot.json docs/odata_changes.json
          git diff --quiet --cached || git commit -m "Daily parliamentary OData snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Run health check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PAGES_URL: "https://elishaifrah3-sudo.github.io/legis-radar/"
        run: python scripts/health_check.py
